    /* Redirect all /books/ fetches to /books-en/ */
    (function () {
      var origFetch = window.fetch;
      window.fetch = function (url) {
        var u = typeof url === 'string' ? url : (url && url.url) || '';
        if (u.indexOf('/books/book-data.json') !== -1)
          return origFetch.call(this, '/books-en/book-data.json');
        if (u.indexOf('/books/audio-map.json') !== -1)
          return origFetch.call(this, '/books-en/audio-map.json');
        return origFetch.apply(this, arguments);
      };
    })();
    </script>

    var RE = {};
    for (var k in M) { RE[k] = new RegExp(k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'), 'g'); }

    var SKIP = {SCRIPT:1,STYLE:1,SVG:1,CANVAS:1,INPUT:1,TEXTAREA:1};

    function tx(node) {
      if (node.nodeType===3) {
        var o=node.textContent, t=o.trim();
        if (!t) return;
        if (M[t]) { node.textContent=o.replace(t,M[t]); return; }
        var changed=false, r=o;
        for (var k in RE) { if (k.length>3 && r.indexOf(k)!==-1) { r=r.replace(RE[k],M[k]); changed=true; } }
        if (changed) node.textContent=r;
        return;
      }
      if (node.nodeType!==1 || SKIP[node.tagName]) return;
      ['aria-label','title','alt','placeholder'].forEach(function(a){
        var v=node.getAttribute(a); if(!v) return;
        var vt=v.trim();
        if (M[vt]) { node.setAttribute(a,M[vt]); return; }
        var c=false, r2=vt;
        for (var k2 in RE) { if(k2.length>3 && r2.indexOf(k2)!==-1) { r2=r2.replace(RE[k2],M[k2]); c=true; } }
        if (c) node.setAttribute(a,r2);
      });
      var ch=node.childNodes;
      for (var j=0;j<ch.length;j++) tx(ch[j]);
    }

    var lt=0;
    function run(){var n=Date.now();if(n-lt<150)return;lt=n;if(document.body)tx(document.body);}

    var ob=new MutationObserver(function(ms){
      for(var i=0;i<ms.length;i++){var ns=ms[i].addedNodes;for(var j=0;j<ns.length;j++)if(ns[j].nodeType===1)tx(ns[j]);}
      run();
    });

    if(document.readyState==='loading'){
      document.addEventListener('DOMContentLoaded',function(){
        setTimeout(run,600);setTimeout(run,1500);setTimeout(run,3000);
        ob.observe(document.body,{childList:true,subtree:true});
      });
    } else {
      setTimeout(run,600);setTimeout(run,1500);setTimeout(run,3000);
      ob.observe(document.body,{childList:true,subtree:true});
    }
    })();
