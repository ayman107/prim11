    <script>
    /* Redirect all /books/ fetches to /books-en/ and /audio/ to /audio-en/ */
    (function () {
      var origFetch = window.fetch;
      window.fetch = function (url) {
        var u = typeof url === 'string' ? url : (url && url.url) || '';
        if (u.startsWith('/books/book-data.json'))
          return origFetch.call(this, '/books-en/book-data.json');
        if (u.startsWith('/books/audio-map.json'))
          return origFetch.call(this, '/books-en/audio-map.json');
        return origFetch.apply(this, arguments);
      };
    })();
    </script>
