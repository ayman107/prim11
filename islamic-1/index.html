<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>التربية الدينية الإسلامية — الصف الأول الابتدائي (قارئ الكتاب)</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Segoe UI", "Amiri", "Noto Kufi Arabic", "Tahoma", sans-serif;
    background:
      radial-gradient(1000px 600px at 50% -10%, rgba(244,208,63,.28), transparent 60%),
      linear-gradient(160deg, #fdf2e9 0%, #fef9e7 40%, #eafaf1 100%);
    color: #2c3e50; min-height: 100vh;
  }
  header {
    background: linear-gradient(120deg, #27ae60, #229954, #1e8449);
    color: #fff; text-align: center; padding: 24px 16px 16px;
    box-shadow: 0 4px 14px rgba(0,0,0,.18);
  }
  header h1 { font-size: clamp(22px, 4.4vw, 40px); margin-bottom: 4px; text-shadow: 1px 2px 3px rgba(0,0,0,.25); }
  header p  { font-size: clamp(14px, 2.2vw, 19px); opacity: .96; }
  .pen-note { margin-top: 8px; font-size: 13px; background: rgba(255,255,255,.2); display: inline-block; padding: 6px 14px; border-radius: 999px; }
  .toolbar {
    max-width: 1050px; margin: 18px auto 4px; padding: 0 14px;
    display: flex; flex-wrap: wrap; gap: 10px; justify-content: center;
  }
  .toolbar button {
    font-family: inherit; font-size: clamp(13px, 2vw, 16px);
    padding: 12px 18px; border: none; border-radius: 12px; cursor: pointer; color: #fff;
    background: linear-gradient(135deg, #2e86c1, #1f618d);
    box-shadow: 0 4px 10px rgba(0,0,0,.16); transition: transform .12s, box-shadow .12s;
  }
  .toolbar button:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(0,0,0,.24); }
  .toolbar button.active { background: linear-gradient(135deg, #d35400, #a04000); }
  main { max-width: 1100px; margin: 0 auto; padding: 6px 14px 60px; }

  .book-frame {
    position: relative;
    background: #fff;
    border-radius: 6px;
    border: 1px solid #d8cbb8;
    box-shadow: 0 12px 34px rgba(0,0,0,.22), 0 2px 8px rgba(0,0,0,.12);
    margin-top: 20px;
    overflow: hidden;
  }
  .book-spine { position: absolute; top: 0; bottom: 0; right: 8px; width: 3px; background: repeating-linear-gradient(180deg, #e9dcc9, #e9dcc9 3px, #d9c9b2 3px, #d9c9b2 6px); }

  .stage {
    position: relative; height: clamp(320px, 82vh, 820px);
    background:
      radial-gradient(120% 100% at 70% 10%, rgba(39,174,96,.05), transparent 55%),
      #faf6ef;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden; touch-action: none;
  }
  .page {
    max-width: 97%; max-height: 97%;
    transform-origin: center center;
    user-select: none; -webkit-user-drag: none; cursor: grab;
    box-shadow: 0 6px 22px rgba(0,0,0,.28);
    touch-action: none;
  }
  .page.dragging { cursor: grabbing; }
  .page-nav {
    position: absolute; top: 50%; transform: translateY(-50%);
    width: 50px; height: 50px; font-size: 28px; border: none; border-radius: 50%;
    background: rgba(255,255,255,.92); cursor: pointer; z-index: 4;
    box-shadow: 0 2px 8px rgba(0,0,0,.2);
  }
  .page-prev { right: 12px; }
  .page-next { left: 12px; }

  .page-info {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 8px 14px; background: #2c3e50; color: #fff;
  }
  .page-info .pg-title { font-size: clamp(13px, 2vw, 16px); font-weight: 700; }
  .page-info .pg-count { font-size: clamp(13px, 2vw, 16px); font-weight: 700; white-space: nowrap; }
  .page-info .pg-hint { font-size: clamp(11px, 1.6vw, 13px); opacity: .85; }

  .listen-bar {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    padding: 10px 12px; border-top: 3px solid #27ae60; background: #fff;
  }
  .listen-bar button {
    font-family: inherit; font-size: clamp(13px, 2vw, 16px);
    padding: 12px 18px; border: none; border-radius: 999px; cursor: pointer;
    background: linear-gradient(135deg, #27ae60, #1e8449); color: #fff;
    box-shadow: 0 4px 10px rgba(0,0,0,.16); transition: transform .12s, box-shadow .12s;
  }
  .listen-bar button:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(0,0,0,.24); }
  .listen-bar .read-full { background: linear-gradient(135deg, #2ecc71, #27ae60); }
  .listen-bar .pg-meta { font-size: 12px; color: #7f8c8d; }
  footer { text-align: center; color: #7f8c8d; font-size: 13px; padding: 20px 10px 30px; }

  .zoom-tools {
    position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%);
    z-index: 6; background: rgba(0,0,0,.55); border-radius: 999px;
    padding: 6px 12px; display: flex; gap: 10px; align-items: center;
  }
  .zoom-tools button { width: 38px; height: 34px; font-size: 17px; border: none; border-radius: 50%; cursor: pointer; background: #fff; }
  .zoom-tools span { color: #fff; font-size: 13px; min-width: 44px; text-align: center; font-weight: 700; }
</style>
</head>
<body>
<header>
  <h1>📖 التربية الدينية الإسلامية</h1>
  <p>الصف الأول الابتدائي — الفصل الدراسي الأول</p>
  <span class="pen-note">🖊️ فعّل القلم الناطق ليقرأ لك الدروس، واضغط «استمع» لقراءة الصفحة كاملة</span>
</header>

<div class="toolbar">
  <button type="button" id="startBtn">🚀 اقرأ من البداية</button>
  <button type="button" id="checkBtn">✅ أتحقق من تعلمي</button>
  <button type="button" id="penBtn">🖊️ القلم الناطق</button>
</div>

<main>
  <div class="book-frame">
    <div class="book-spine"></div>
    <div class="stage" id="stage">
      <button type="button" class="page-nav page-prev" id="prevBtn">›</button>
      <img class="page" id="pageImg" alt="صفحة الكتاب" draggable="false">
      <button type="button" class="page-nav page-next" id="nextBtn">‹</button>
      <div class="zoom-tools">
        <button type="button" id="zoomOut">−</button>
        <span id="zoomVal">100%</span>
        <button type="button" id="zoomReset">⟲</button>
        <button type="button" id="zoomIn">+</button>
      </div>
    </div>
    <div class="page-info">
      <span class="pg-title" id="pageTitle">درس الصفحة 5</span>
      <span class="pg-count" id="pageCount">صفحة 5 من 86</span>
      <span class="pg-hint" id="pageHint">اقلب الصفحات بالأسهم أو بالسحب</span>
    </div>
    <div class="listen-bar">
      <button type="button" class="read-full" id="listenFull">🔊 استمع كاملًا لهذه الصفحة</button>
      <button type="button" id="listenTitle">🗣️ اسمع العنوان</button>
    </div>
  </div>
</main>

<footer>منصة تعليمية تفاعلية للأطفال — دروس الصف الأول الابتدائي</footer>

<script>
(function () {
  "use strict";
  var TOPICS_URL = "topics.json";
  var REPORT_URL = "report.json";

  var topics = [];
  var reportPages = {};
  var total = 86;
  var cur = 5;

  function pad3(n) {
    n = Number(n);
    if (n < 10) { return "00" + n; }
    if (n < 100) { return "0" + n; }
    return String(n);
  }
  function pageURL(n) { return "pages/p" + pad3(n) + ".png"; }

  var stage = document.getElementById("stage");
  var pageImg = document.getElementById("pageImg");
  var pageTitle = document.getElementById("pageTitle");
  var pageCount = document.getElementById("pageCount");
  var pageHint = document.getElementById("pageHint");
  var zoomVal = document.getElementById("zoomVal");

  var zoomLevel = 100;
  var tx = 0, ty = 0;
  var dragging = false, sx = 0, sy = 0;

  function applyZoom() {
    var s = zoomLevel / 100;
    pageImg.style.transform = "scale(" + s + ") translate(" + tx + "px," + ty + "px)";
    zoomVal.textContent = zoomLevel + "%";
  }
  function setZoom(v) { zoomLevel = Math.max(50, Math.min(600, v)); if (zoomLevel === 100) { tx = 0; ty = 0; } applyZoom(); }
  function askZoom(d) { setZoom(zoomLevel + d); }

  function speak(text, voice) {
    if (!text) { return; }
    var v = voice || "ar-SA-HamedNeural";
    var url = "/api/tts?text=" + encodeURIComponent(text) + "&voice=" + encodeURIComponent(v);
    var audio = new Audio(url);
    audio.play().catch(function () {
      if ("speechSynthesis" in window) {
        var u = new SpeechSynthesisUtterance(text);
        u.lang = "ar-SA";
        speechSynthesis.speak(u);
      }
    });
  }
  function fullText(n) {
    var t = reportPages[n];
    if (n === 73) {
      var check = topics.find(function (x) { return Number(x.page) === n; });
      return "صفحة أتحقق من تعلمي — اقرأ الأسئلة الموجودة في الصفحة وأجب عنها للمعلم";
    }
    if (n === 5) {
      return "صفحة البداية — ابدأ قراءة دروس التربية الدينية الإسلامية من الصف الأول الابتدائي";
    }
    if (t && t.text) { return t.text.trim(); }
    var top = topics.find(function (x) { return Number(x.page) === n; });
    if (top && top.title) { return top.title.trim(); }
    return "";
  }

  function openPage(n) {
    cur = Number(n) || 5;
    if (cur < 1) { cur = 1; }
    if (cur > total) { cur = total; }
    zoomLevel = 100; tx = 0; ty = 0;
    pageImg.src = pageURL(cur);
    var t = topics.find(function (x) { return Number(x.page) === cur; });
    pageTitle.textContent = "درس الصفحة " + cur;
    if (t && t.title) { pageTitle.textContent = t.title; }
    pageCount.textContent = "صفحة " + cur + " من " + total;
    var rt = reportPages[cur];
    pageHint.textContent = rt && rt.text ? "جاهزة للاستماع الكامل" : "اضغط «استمع كاملًا» لقراءة هذه الصفحة";
    applyZoom();
  }

  function prevPage() { cur = cur > 1 ? cur - 1 : 1; openPage(cur); }
  function nextPage() { cur = cur < total ? cur + 1 : total; openPage(cur); }

  function panStart(e) {
    dragging = true;
    pageImg.classList.add("dragging");
    sx = (e.touches ? e.touches[0].clientX : e.clientX);
    sy = (e.touches ? e.touches[0].clientY : e.clientY);
    e.preventDefault();
  }
  function panMove(e) {
    if (!dragging) { return; }
    var x = (e.touches ? e.touches[0].clientX : e.clientX);
    var y = (e.touches ? e.touches[0].clientY : e.clientY);
    tx += x - sx; ty += y - sy;
    sx = x; sy = y;
    applyZoom();
    e.preventDefault();
  }
  function panEnd() {
    dragging = false;
    pageImg.classList.remove("dragging");
    applyZoom();
  }

  function loadTopics() {
    fetch(TOPICS_URL, { cache: "no-store" })
      .then(function (r) { return r.json(); })
      .then(function (data) {
        if (Array.isArray(data)) { topics = data; }
        else if (data && Array.isArray(data.topics)) { topics = data.topics; }
        else if (data && Array.isArray(data.lessons)) { topics = data.lessons; }
      })
      .catch(function () {});
  }

  function loadReport() {
    fetch(REPORT_URL, { cache: "no-store" })
      .then(function (r) { return r.json(); })
      .then(function (data) {
        if (data && Array.isArray(data.page_texts)) {
          data.page_texts.forEach(function (t) {
            if (t && t.page) { reportPages[Number(t.page)] = t; }
          });
        }
      })
      .catch(function () {});
  }

  document.getElementById("startBtn").addEventListener("click", function () { openPage(5); });
  document.getElementById("checkBtn").addEventListener("click", function () { openPage(73); });
  document.getElementById("penBtn").addEventListener("click", function () {
    document.body.classList.toggle("pen-active");
    this.classList.toggle("active");
  });

  document.getElementById("prevBtn").addEventListener("click", prevPage);
  document.getElementById("nextBtn").addEventListener("click", nextPage);
  document.getElementById("zoomIn").addEventListener("click", function () { askZoom(20); });
  document.getElementById("zoomOut").addEventListener("click", function () { askZoom(-20); });
  document.getElementById("zoomReset").addEventListener("click", function () { setZoom(100); });

  document.getElementById("listenFull").addEventListener("click", function () {
    var txt = fullText(cur);
    if (txt) { speak(txt); }
    else { speak("صفحة " + cur + " من كتاب التربية الدينية الإسلامية"); }
  });
  document.getElementById("listenTitle").addEventListener("click", function () {
    var t = topics.find(function (x) { return Number(x.page) === cur; });
    speak(t && t.title ? t.title : ("صفحة " + cur));
  });

  stage.addEventListener("mousedown", panStart);
  stage.addEventListener("mousemove", panMove);
  stage.addEventListener("mouseup", panEnd);
  stage.addEventListener("mouseleave", panEnd);
  stage.addEventListener("touchstart", panStart, { passive: false });
  stage.addEventListener("touchmove", panMove, { passive: false });
  stage.addEventListener("touchend", panEnd);
  stage.addEventListener("touchcancel", panEnd);
  stage.addEventListener("wheel", function (e) {
    e.preventDefault();
    setZoom(zoomLevel + (e.deltaY < 0 ? 15 : -15));
  }, { passive: false });

  document.addEventListener("keydown", function (e) {
    if (e.key === "ArrowRight") { prevPage(); }
    if (e.key === "ArrowLeft") { nextPage(); }
  });

  loadTopics();
  loadReport();
  openPage(5);
})();
</script>
</body>
</html>
