    /* Yumo AR: interactive lesson explanations — اسمع، العب، واكسب النجوم */
    (function () {
      var DATA = null, LANG = 'ar';

      /* Pause the app's page narration while the explain modal is open (prevents overlapping voices) */
      window.__yumoExplain = 0;
      if (!window.__yumoMediaPatched) {
        window.__yumoMediaPatched = 1;
        var __yumoOP = HTMLMediaElement.prototype.play;
        HTMLMediaElement.prototype.play = function () {
          if (window.__yumoExplain && !this.__yumoOwn) {
            try { this.pause(); } catch (e) {}
            return Promise.resolve();
          }
          return __yumoOP.apply(this, arguments);
        };
      }
      var __yumoMuteInt = null;
      function yumoMuteOn() {
        window.__yumoExplain = 1;
        try { if ('speechSynthesis' in window) window.speechSynthesis.cancel(); } catch (e) {}
        if (!__yumoMuteInt) __yumoMuteInt = setInterval(function () {
          try { if ('speechSynthesis' in window) window.speechSynthesis.cancel(); } catch (e) {}
        }, 600);
      }
      function yumoMuteOff() {
        window.__yumoExplain = 0;
        if (__yumoMuteInt) { clearInterval(__yumoMuteInt); __yumoMuteInt = null; }
      }

      function byTitle(t) {
        if (!DATA) return null;
        t = (t || '').trim();
        for (var i = 0; i < DATA.units.length; i++) {
          var ls = DATA.units[i].lessons || [];
          for (var j = 0; j < ls.length; j++) if (ls[j].title === t) return ls[j];
        }
        return null;
      }
      function unitByTitle(t) {
        if (!DATA) return null;
        t = (t || '').trim();
        for (var i = 0; i < DATA.units.length; i++) if (DATA.units[i].title === t) return DATA.units[i];
        return null;
      }
      function resolve() {
        var el = document.querySelector('.reader-breadcrumb strong');
        var t = el ? el.textContent.trim() : '';
        if (t && DATA && DATA.specials && DATA.specials[t]) {
          var s = DATA.specials[t];
          return { title: t, en: s.en, ar: s.ar, quiz: null };
        }
        if (t) {
          var l = byTitle(t); if (l) return { title: t, en: l.en, ar: l.ar, quiz: l.quiz || null };
          var u = unitByTitle(t); if (u) return { title: t, en: u.intro.en, ar: u.intro.ar, quiz: null };
        }
        return { title: 'فهرس الكتاب', en: DATA.front.en, ar: DATA.front.ar, quiz: null };
      }

      var audioEl = document.createElement('audio');
      audioEl.__yumoOwn = 1;
      var curAudio = null, curGen = 0;
      function speak(text, done, forceLang) {
        stopSpeak();
        var lng = forceLang || LANG;
        var voice = lng === 'ar' ? 'ar-SA-ZariyahNeural' : 'en-US-AriaNeural';
        var my = ++curGen;
        curAudio = audioEl;
        try { audioEl.src = '/api/tts?text=' + encodeURIComponent(text) + '&voice=' + encodeURIComponent(voice); } catch (e) {}
        audioEl.playbackRate = 0.92;
        audioEl.onended = function () { if (curGen === my) { curAudio = null; if (done) done(); } };
        audioEl.onerror = function () {
          if (curGen !== my) return;
          curAudio = null;
          if ('speechSynthesis' in window) {
            try {
              var u = new SpeechSynthesisUtterance(text);
              u.lang = lng === 'ar' ? 'ar-EG' : 'en-US';
              u.rate = 0.92; u.pitch = 1.05;
              var vs = window.speechSynthesis.getVoices();
              for (var k = 0; k < vs.length; k++) { if (vs[k].lang.indexOf(lng) === 0) { u.voice = vs[k]; break; } }
              if (done) { u.onend = done; u.onerror = done; }
              window.__yumoExplain = 0;
              window.speechSynthesis.speak(u);
              window.__yumoExplain = 1;
            } catch (e) { if (done) done(); }
          } else if (done) done();
        };
        var pr = audioEl.play();
        if (pr && pr.catch) pr.catch(function () { if (curGen === my) { curAudio = null; if (done) done(); } });
      }
      function stopSpeak() {
        curGen++;
        if (curAudio) { try { curAudio.pause(); curAudio.currentTime = 0; } catch (e) {} }
        curAudio = null;
        if ('speechSynthesis' in window) window.speechSynthesis.cancel();
      }

      var T = {
        ar: {
          hi: 'مرحبًا! أنا يومو. اضغط «استمع» وسأقرأ لك هذا الدرس، ثم نلعب معًا!',
          hint: 'المس أي كلمة لتسمعها 👆',
          listen: '🔊 استمع', playing: '▶ يُقرأ الآن', stop: '⏹ إيقاف',
          playG: '🎮 هيا نلعب!', other: 'English', close: '✕ إغلاق',
          stars: 'نجومك', q: 'سؤال',
          praise: ['أحسنت!', 'رائع يا بطل!', 'ممتاز!', 'برافو!'],
          again: 'قاربت! جرّب مرة أخرى',
          win: 'أنت بطل! 🏆', win2: 'أحسنت! 🌟', replay: '🔁 العب من جديد',
          listenAgain: '🔊 استمع للدرس', comeOn: 'هيا نجمع النجوم!'
        },
        en: {
          hi: 'Hi! I am Yumo. Press Listen and I will read this lesson, then we play together!',
          hint: 'Tap any word to hear it 👆',
          listen: '🔊 Listen', playing: '▶ Playing', stop: '⏹ Stop',
          playG: '🎮 Let\u2019s play!', other: 'العربية', close: '✕ Close',
          stars: 'Your stars', q: 'Question',
          praise: ['Great job!', 'Awesome!', 'Excellent!', 'Bravo!'],
          again: 'Almost! Try again',
          win: 'You are a star! 🏆', win2: 'Well done! 🌟', replay: '🔁 Play again',
          listenAgain: '🔊 Listen again', comeOn: 'Let us collect stars!'
        }
      };
      function t() { return T[LANG]; }

      var modalEl = null, state = null, stage = 'listen', renderRef = null;

      function closeModal() {
        stopSpeak();
        yumoMuteOff();
        if (modalEl) { document.body.removeChild(modalEl); modalEl = null; }
        state = null; renderRef = null;
      }

      function mkBtn(txt, pri, cb) {
        var b = document.createElement('button');
        b.type = 'button';
        b.textContent = txt;
        b.style.cssText = 'border:0;border-radius:14px;padding:11px 18px;font-size:14.5px;cursor:pointer;font-family:inherit' +
          (pri ? ';background:#f5b942;color:#2d2a22;font-weight:700' : ';background:#efece2;color:#4a4638');
        b.onclick = cb;
        return b;
      }

      function openModal() {
        stopSpeak();
        yumoMuteOn();
        state = { info: resolve(), stars: 0, qi: 0, done: 0 };
        stage = 'listen';

        var wrap = document.createElement('div');
        wrap.style.cssText = 'position:fixed;inset:0;z-index:99999;background:rgba(57,54,45,.55);display:flex;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(2px)';
        var card = document.createElement('div');
        card.style.cssText = 'background:#fffdf8;border-radius:22px;max-width:600px;width:100%;max-height:88vh;overflow:auto;box-shadow:0 18px 50px rgba(0,0,0,.22);padding:22px 22px 18px;font-family:inherit';

        var head = document.createElement('div');
        head.style.cssText = 'display:flex;align-items:center;gap:10px;margin:0 0 8px';
        var h = document.createElement('h2');
        h.style.cssText = 'margin:0;font-size:19px;color:#2d2a22;flex:1';
        h.textContent = state.info.title;
        var starsEl = document.createElement('div');
        starsEl.style.cssText = 'font-size:19px;letter-spacing:2px;white-space:nowrap;color:#f5b942';
        head.appendChild(h); head.appendChild(starsEl);

        var yumoRow = document.createElement('div');
        yumoRow.style.cssText = 'display:flex;gap:12px;align-items:flex-start;background:#fdf3dd;border:1.5px solid #f5cf7f;border-radius:16px;padding:12px 14px;margin:8px 0 14px';
        var fox = document.createElement('img');
        fox.src = '/images/yomo.webp'; fox.alt = 'يومو الثعلب';
        fox.style.cssText = 'width:54px;height:54px;object-fit:contain;flex:none;border-radius:12px;background:#fff;padding:4px;box-shadow:0 2px 8px rgba(0,0,0,.12)';
        var bubble = document.createElement('div');
        bubble.style.cssText = 'flex:1;font-size:15.5px;line-height:1.6;color:#5a4a22;min-height:22px';
        yumoRow.appendChild(fox); yumoRow.appendChild(bubble);

        var host = document.createElement('div');
        var controls = document.createElement('div');
        controls.style.cssText = 'display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:14px';

        var play = mkBtn(t().listen, true, function () {
          fox.style.animation = 'yumoTalk .8s ease-in-out 3';
          play.textContent = t().playing;
          speak(LANG === 'ar' ? state.info.ar : state.info.en, function () {
            fox.style.animation = '';
            play.textContent = t().listen;
          });
        });
        var stopB = mkBtn(t().stop, false, function () { stopSpeak(); fox.style.animation = ''; play.textContent = t().listen; });
        var langB = mkBtn(t().other, false, function () { LANG = LANG === 'ar' ? 'en' : 'ar'; render(); });
        var closeB = mkBtn(t().close, false, closeModal);
        controls.appendChild(play); controls.appendChild(stopB); controls.appendChild(langB); controls.appendChild(closeB);

        card.appendChild(head); card.appendChild(yumoRow); card.appendChild(host); card.appendChild(controls);
        wrap.appendChild(card);
        wrap.onclick = function (e) { if (e.target === wrap) closeModal(); };
        modalEl = wrap;
        document.body.appendChild(wrap);

        function setBubble(txt) { bubble.textContent = txt; }
        function paintStars() {
          var s = '';
          for (var i = 0; i < 3; i++) s += i < state.stars ? '★' : '☆';
          starsEl.textContent = s;
        }

        function render() {
          play.textContent = t().listen;
          stopB.textContent = t().stop;
          langB.textContent = t().other;
          closeB.textContent = t().close;
          paintStars();
          host.innerHTML = '';
          if (stage === 'listen') renderListen();
          else if (stage === 'play') renderPlay();
          else renderReward();
        }
        renderRef = render;
        render();

        function renderListen() {
          play.style.display = '';
          setBubble(t().hi);
          var p = document.createElement('p');
          p.style.cssText = 'font-size:16.5px;line-height:1.9;color:#3d3a31;margin:0 0 6px';
          addTappable(p, LANG === 'ar' ? state.info.ar : state.info.en);
          host.appendChild(p);
          var hint = document.createElement('div');
          hint.style.cssText = 'font-size:13px;color:#9a8a5a;margin:2px 0 10px';
          hint.textContent = t().hint;
          host.appendChild(hint);
          if (state.info.quiz && state.info.quiz.questions) {
            var g = mkBtn(t().playG, true, function () { state.qi = 0; stage = 'play'; render(); });
            host.appendChild(g);
          }
        }

        function addTappable(el, text) {
          var parts = (text || '').split(/(\s+)/);
          parts.forEach(function (w) {
            if (!w.trim()) { el.appendChild(document.createTextNode(w)); return; }
            var s = document.createElement('span');
            s.textContent = w;
            s.style.cssText = 'cursor:pointer;border-radius:7px;padding:0 2px;transition:background .15s';
            s.onclick = function () {
              s.style.background = '#ffe9a8';
              speak(w, function () { s.style.background = ''; });
              setTimeout(function () { s.style.background = ''; }, 900);
            };
            el.appendChild(s);
          });
        }

        function renderPlay() {
          play.style.display = 'none';
          var qs = state.info.quiz.questions;
          var q = qs[state.qi];
          setBubble(LANG === 'ar' ? q.q_ar : q.q_en);
          speak(LANG === 'ar' ? q.q_ar : q.q_en);

          var dots = document.createElement('div');
          dots.style.cssText = 'font-size:13px;color:#b3a26a;letter-spacing:4px;margin:0 0 10px';
          var ds = '';
          for (var i = 0; i < qs.length; i++) ds += i < state.qi ? '● ' : (i === state.qi ? '◉ ' : '○ ');
          dots.textContent = ds;
          host.appendChild(dots);

          var prompt = document.createElement('div');
          prompt.style.cssText = 'font-size:18px;font-weight:700;color:#3d3a31;margin:0 0 14px';
          prompt.textContent = LANG === 'ar' ? q.q_ar : q.q_en;
          host.appendChild(prompt);

          if (q.type === 'fill') {
            var word = document.createElement('div');
            word.dir = 'rtl';
            word.style.cssText = 'font-size:44px;font-weight:800;color:#2d2a22;text-align:center;margin:0 0 6px;letter-spacing:2px';
            word.textContent = '▢ ' + q.word.slice(1);
            word.dataset.mask = '1';
            host.appendChild(word);
            var tr = document.createElement('div');
            tr.style.cssText = 'font-size:13px;color:#9a8a5a;text-align:center;margin:0 0 12px';
            tr.textContent = q.tr || '';
            host.appendChild(tr);
          }

          var grid = document.createElement('div');
          grid.style.cssText = 'display:flex;gap:12px;justify-content:center;flex-wrap:wrap';
          q.options.forEach(function (opt) {
            var b = document.createElement('button');
            b.type = 'button';
            var big = q.type === 'word';
            b.style.cssText = 'border:2.5px solid #f0d9a0;background:#fff;border-radius:18px;cursor:pointer;font-family:inherit;' +
              (big ? 'min-width:120px;padding:16px 14px;display:flex;flex-direction:column;align-items:center;gap:6px'
                   : 'width:88px;height:88px;font-size:38px;font-weight:800;color:#2d2a22');
            if (big) {
              var em = document.createElement('div'); em.style.cssText = 'font-size:40px;line-height:1'; em.textContent = opt.e || '📘';
              var tx = document.createElement('div'); tx.style.cssText = 'font-size:19px;font-weight:800;color:#2d2a22'; tx.textContent = opt.t;
              b.appendChild(em); b.appendChild(tx);
            } else {
              b.textContent = opt.t;
            }
            b.onclick = function () {
              if (b.dataset.locked) return;
              if (opt.t === q.answer) {
                b.dataset.locked = '1';
                b.style.background = '#d8f5cf'; b.style.borderColor = '#6fc94b';
                if (q.type === 'fill') {
                  var m = host.querySelector('[data-mask]');
                  if (m) m.textContent = q.answer + ' ' + q.word.slice(1);
                }
                state.stars++;
                paintStars();
                var praise = t().praise[Math.floor(Math.random() * t().praise.length)];
                setBubble(praise + (q.type === 'word' ? ' ' + opt.t : ''));
                speak(praise, function () {
                  if (state.qi < qs.length - 1) { state.qi++; render(); }
                  else { stage = 'reward'; render(); }
                }, LANG);
              } else {
                b.style.background = '#ffe0e0'; b.style.borderColor = '#e88';
                setBubble(t().again);
                speak(t().again, function () {
                  b.style.background = '#fff'; b.style.borderColor = '#f0d9a0';
                }, LANG);
                setTimeout(function () { b.style.background = '#fff'; b.style.borderColor = '#f0d9a0'; }, 900);
              }
            };
            grid.appendChild(b);
          });
          host.appendChild(grid);
        }

        function renderReward() {
          play.style.display = 'none';
          var win = state.stars >= 3;
          setBubble(win ? t().win : t().win2);
          speak(win ? t().win : t().win2);
          fox.style.animation = 'yumoTalk .7s ease-in-out 4';
          var big = document.createElement('div');
          big.style.cssText = 'text-align:center;font-size:52px;letter-spacing:6px;color:#f5b942;margin:6px 0 4px';
          big.textContent = '★'.repeat(Math.min(state.stars, 3)) + '☆'.repeat(Math.max(0, 3 - state.stars));
          var msg = document.createElement('div');
          msg.style.cssText = 'text-align:center;font-size:20px;font-weight:800;color:#2d2a22;margin:0 0 16px';
          msg.textContent = win ? t().win : t().win2;
          host.appendChild(big); host.appendChild(msg);
          var bar = document.createElement('div');
          bar.style.cssText = 'display:flex;gap:10px;justify-content:center;flex-wrap:wrap';
          bar.appendChild(mkBtn(t().replay, true, function () { state.stars = 0; state.qi = 0; stage = 'play'; render(); }));
          bar.appendChild(mkBtn(t().listenAgain, false, function () { stage = 'listen'; render(); }));
          host.appendChild(bar);
        }
      }

      var btn = null;
      function ensureButton() {
        var host = document.querySelector('.reader-top-actions');
        if (!host) return;
        if (btn && document.body.contains(btn)) return;
        btn = mkExplainButton();
        host.insertBefore(btn, host.firstChild);
      }
      function mkExplainButton() {
        var b = document.createElement('button');
        b.type = 'button';
        b.textContent = '✨ اشرح لي';
        b.style.cssText = 'border:0;border-radius:12px;padding:8px 13px;font-size:13.5px;font-weight:700;cursor:pointer;font-family:inherit;background:linear-gradient(135deg,#ffd98a,#f5b942);color:#2d2a22;box-shadow:0 3px 10px rgba(245,185,66,.35)';
        b.onclick = function () {
          if (DATA) { openModal(); return; }
          fetch('/books-islamic/lessons.json').then(function (r) { return r.ok ? r.json() : Promise.reject(); }).then(function (d) {
            DATA = d; openModal();
          }).catch(function () { alert('الشرح غير متاح الآن. تحقق من الاتصال وأعد المحاولة.'); });
        };
        return b;
      }

      function load() {
        try {
          fetch('/books-islamic/lessons.json').then(function (r) { if (!r.ok) throw 0; return r.json(); }).then(function (d) { DATA = d; }).catch(function () {});
        } catch (e) {}
      }
      load();

      var ob = new MutationObserver(function (ms) {
        for (var i = 0; i < ms.length; i++) {
          var ns = ms[i].addedNodes;
          for (var j = 0; j < ns.length; j++) if (ns[j] && ns[j].nodeType === 1) ensureButton();
        }
      });
      document.addEventListener('DOMContentLoaded', function () {
        setTimeout(ensureButton, 700); setTimeout(ensureButton, 1600); setTimeout(ensureButton, 3000);
        ob.observe(document.body, { childList: true, subtree: true });
      });
    })();
    </script>
    <script src="/islamic/tahfiz.js"></script>
    <script src="/speak-husary.js"></script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
